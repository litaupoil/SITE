<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;background:#fff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;overflow-x:hidden;color:#1a1a18}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1.3rem 2.5rem;background:#fff}
.nav-name{font-size:0.85rem;font-weight:400;color:#1a1a18;text-decoration:none;letter-spacing:0.02em;transform:scaleY(1.6);display:inline-block;transform-origin:top left}
.nav-links{display:flex;gap:2.2rem;list-style:none}
.nav-links a{font-size:0.75rem;letter-spacing:0.08em;color:#999;text-decoration:none;transition:color 0.15s;text-transform:lowercase;display:inline-block;transform:scaleY(1.6);transform-origin:top center}
.nav-links a:hover{color:#ff1493}
.nav-links a.active{color:#1a1a18}
.page{display:none;padding-top:5rem;min-height:100vh}
.page.active{display:block}

/* PHOTO WALL */
#page-photo{padding-top:5rem;position:relative;min-height:100vh}
#wall{position:relative;width:100%}
.photo-cluster{position:absolute;cursor:pointer}
.photo-thumb-ph{display:block;transition:opacity 0.25s}
.photo-cluster:hover .photo-thumb-ph,.photo-cluster:hover img{opacity:0.65}
.photo-caption{margin-top:0.4rem;font-size:0.65rem;letter-spacing:0.08em;color:#ccc;text-transform:lowercase;transform:scaleY(1.5);transform-origin:top left;display:inline-block}

/* GRAPHISME WALL */
#page-graphisme{padding-top:5rem;position:relative;min-height:100vh}
#gwall{position:relative;width:100%}
.g-cluster{position:absolute;cursor:pointer}
.g-thumb{display:block;transition:opacity 0.25s}
.g-cluster:hover .g-thumb,.g-cluster:hover img{opacity:0.65}
.g-caption{margin-top:0.4rem;font-size:0.65rem;letter-spacing:0.08em;color:#ccc;text-transform:lowercase;transform:scaleY(1.5);transform-origin:top left;display:inline-block}

.c1{background:#ddd9d3}.c2{background:#ccc8c0}.c3{background:#d4d0ca}
.c4{background:#c8c4bc}.c5{background:#e0dcd6}.c6{background:#c0bcb4}
.c7{background:#d8d4ce}.c8{background:#b8b4ac}.c9{background:#dcdad4}

/* VIDEO */
#page-video{padding:5.5rem 3rem 6rem}
.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5rem}
.video-item{cursor:pointer;text-decoration:none;display:block}
.video-thumb{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;transition:opacity 0.25s}
.video-item:hover .video-thumb{opacity:0.65}
.play-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;position:absolute}
.video-caption{margin-top:0.5rem;font-size:0.65rem;letter-spacing:0.08em;color:#bbb;text-transform:lowercase;transform:scaleY(1.5);display:inline-block;transform-origin:top left}

/* INFO */
#page-info{position:relative;min-height:100vh;padding-top:5rem}
.info-text-block{position:absolute;left:2.8rem}
.info-line{font-size:0.82rem;letter-spacing:0.05em;color:#1a1a18;font-weight:300;transform:scaleY(1.6);transform-origin:top left;display:block;white-space:nowrap;line-height:1}
.info-line a{color:#1a1a18;text-decoration:none;border-bottom:1px solid #ddd;transition:border-color 0.2s}
.info-line a:hover{border-color:#1a1a18}
.info-photo{position:absolute;cursor:default}
.info-photo-ph{display:block}

/* LIGHTBOX — partagée photo + graphisme */
#lightbox{display:none;position:fixed;inset:0;z-index:200;background:#fff;flex-direction:column;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lb-close{position:fixed;top:1.4rem;right:2.2rem;background:none;border:none;cursor:pointer;font-size:0.7rem;letter-spacing:0.12em;color:#aaa;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;text-transform:lowercase;transform:scaleY(1.5);display:inline-block;transform-origin:top right}
#lb-close:hover{color:#1a1a18}
#lb-series-title{font-size:0.7rem;letter-spacing:0.1em;color:#ccc;margin-bottom:1.2rem;text-transform:lowercase;transform:scaleY(1.5);display:inline-block}
#lb-img-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;flex:1;padding:0 5rem}
#lb-img{max-width:72vw;max-height:72vh;object-fit:contain;display:block}
.lb-ph{max-width:72vw;max-height:72vh;width:48vw;height:62vh}
#lb-prev,#lb-next{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:#ccc;padding:1.5rem;transition:color 0.2s;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300}
#lb-prev:hover,#lb-next:hover{color:#1a1a18}
#lb-prev{left:1rem}#lb-next{right:1rem}
#lb-counter{font-size:0.65rem;letter-spacing:0.18em;color:#ccc;margin:0.8rem 0;transform:scaleY(1.4);display:inline-block}
#lb-thumbs{display:flex;gap:5px;padding:0 3rem 2rem;justify-content:center;flex-wrap:wrap}
.lb-thumb,.lb-thumb-ph{width:40px;height:40px;cursor:pointer;opacity:0.3;transition:opacity 0.2s;object-fit:cover}
.lb-thumb.active,.lb-thumb-ph.active{opacity:1;outline:1px solid #aaa;outline-offset:2px}
.lb-thumb:hover,.lb-thumb-ph:hover{opacity:0.65}
</style>

function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-links a').forEach(a=>a.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  window.scrollTo(0,0);
}

function makeImg(src,w,h){ const i=document.createElement('img');i.src=src;i.style.cssText='width:'+w+'px;height:'+h+'px;object-fit:cover;display:block';return i; }

// ── LIGHTBOX (photo + graphisme) ──────────────────────────────────────────────
let curSeries = null, curIdx = 0;

function openLightbox(s, idx){
  curSeries = s; curIdx = idx;
  document.getElementById('lightbox').classList.add('open');
  document.getElementById('lb-series-title').textContent = s.title;
  document.body.style.overflow = 'hidden';
  renderLbImage(); renderThumbs();
}

function renderLbImage(){
  const p = curSeries.photos[curIdx];
  const wrap = document.getElementById('lb-img-container'); wrap.innerHTML = '';
  if(p.src){
    const img = document.createElement('img'); img.id='lb-img'; img.src=p.src; img.alt=curSeries.title;
    wrap.appendChild(img);
  } else {
    const d = document.createElement('div'); d.className='lb-ph '+(p.ph||'c1');
    wrap.appendChild(d);
  }
  document.getElementById('lb-counter').textContent = (curIdx+1) + ' — ' + curSeries.photos.length;
  document.querySelectorAll('.lb-thumb,.lb-thumb-ph').forEach((t,i) => t.classList.toggle('active', i===curIdx));
}

function renderThumbs(){
  const tb = document.getElementById('lb-thumbs'); tb.innerHTML = '';
  curSeries.photos.forEach((p,i) => {
    if(p.src){
      const img = document.createElement('img');
      img.src = p.src; img.className='lb-thumb'+(i===curIdx?' active':'');
      img.onclick = () => { curIdx=i; renderLbImage(); };
      tb.appendChild(img);
    } else {
      const d = document.createElement('div');
      d.className = 'lb-thumb-ph '+(p.ph||'c1')+(i===curIdx?' active':'');
      d.onclick = () => { curIdx=i; renderLbImage(); };
      tb.appendChild(d);
    }
  });
}

function closeLb(){ document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('lb-close').onclick = closeLb;
document.getElementById('lb-prev').onclick = () => { curIdx=(curIdx-1+curSeries.photos.length)%curSeries.photos.length; renderLbImage(); };
document.getElementById('lb-next').onclick = () => { curIdx=(curIdx+1)%curSeries.photos.length; renderLbImage(); };
document.addEventListener('keydown', e => {
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key==='ArrowRight') document.getElementById('lb-next').click();
  if(e.key==='ArrowLeft')  document.getElementById('lb-prev').click();
  if(e.key==='Escape')     closeLb();
});
</script>
